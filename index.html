<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <title>CalDemon</title>
    <meta name="description" content="Train, fuel and recover. Your personal fitness companion." />
    <meta name="theme-color" content="#0b0a12" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CalDemon" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- iPhone 14 Pro launch screen -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash-1179x2556.png"
    />
    <style>
      html, body { background: #0b0a12; margin: 0; }
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif; color: #fff; }
      #boot img { width: 88px; height: 88px; animation: bootpulse 1.6s ease-in-out infinite; filter: drop-shadow(0 0 24px rgba(139, 92, 246, .45)); }
      #boot span { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
      #boot b { color: #a78bfa; }
      @keyframes bootpulse { 0%, 100% { transform: scale(1); opacity: 1 } 50% { transform: scale(.94); opacity: .8 } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot"><img src="/favicon.svg" alt="" /><span>Cal<b>Demon</b></span></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
